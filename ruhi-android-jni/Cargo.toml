[package]
name = "ruhi-android-jni"
version = "0.1.0"
edition = "2021"
authors = ["RuhOS Community", "大十"]
description = "RuhI (如喜) Android JNI Bridge for Hsu + Western Physical Keyboard IME"
license = "Apache-2.0"

[lib]
name = "ruhi_android_jni"
crate-type = ["cdylib", "rlib"]

[dependencies]
ruhi-core = { path = "../ruhi-core" }
jni = { version = "0.21", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
