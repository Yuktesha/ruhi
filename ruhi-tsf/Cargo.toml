[package]
name = "ruhi-tsf"
version = "0.1.0"
edition = "2021"
authors = ["RuhOS Community", "大十"]
description = "RuhI (如喜) Native Windows 11 TSF Input Method COM Server"

[lib]
name = "ruhi_tsf"
crate-type = ["cdylib"]

[dependencies]
ruhi-core = { path = "../ruhi-core" }
windows = { version = "0.58", features = [
    "implement",
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
] }
windows-core = "0.58"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
