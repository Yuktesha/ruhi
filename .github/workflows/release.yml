name: Ruhi Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Package Windows Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pefile

      - name: Run Core Tests
        run: cargo test --release
        working-directory: ruhi-core

      - name: Run Python Tuner Tests
        run: python -m unittest discover -s tests -p "test_semantic_tuner.py" -v

      - name: Build ruhi-core Release
        run: cargo build --release
        working-directory: ruhi-core

      - name: Build ruhi-tsf Release
        run: cargo build --release
        working-directory: ruhi-tsf

      - name: Run Release Packager (Zip)
        run: python tools/package_release.py

      - name: Build Windows Standard Installer (Inno Setup)
        run: |
          choco install innosetup --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ruhi_setup.iss
          python -c "import hashlib, pathlib; [pathlib.Path(str(p)+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest() + ' *' + p.name + '\n') for p in pathlib.Path('dist').glob('RuhI_Setup_v*.exe')]"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RuhI_Setup_v*.exe
            dist/RuhI_Setup_v*.exe.sha256
            dist/RuhI_v*_Windows_x64.zip
            dist/RuhI_v*_Windows_x64.zip.sha256
          generate_release_notes: true
