[package]
name = "ruhi-core"
version = "0.5.5"
edition = "2021"
authors = ["RuhOS Community", "大十"]
description = "RuhI (如喜) Universal Chinese Input Method Engine - Pure Rust Core"

[lib]
name = "ruhi"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "ruhi_cangjie_tester"
path = "src/bin/cangjie_tester.rs"

[[bin]]
name = "ruhi_eval"
path = "src/bin/ruhi_eval.rs"







